# ===== MT5 Trading Bot - inställningar =====
# Inloggning (konto, lösenord, server) läggs i .env - se .env.example

# Symboler att handla (måste finnas hos din broker, t.ex. "EURUSD" eller "EURUSD.m")
symbols:
  - EURUSD
  - GBPUSD
  - USDJPY

# Tidsram för candles: M1, M5, M15, M30, H1, H4, D1
timeframe: H1

# Unikt ID så boten bara rör sina egna positioner
magic_number: 20260926

# Hur ofta (sekunder) boten kollar efter nya candles
poll_seconds: 10

# true = simulera bara (loggar vad den SKULLE göra). Sätt till false för riktig handel.
dry_run: true

# Stäng befintlig position när motsatt signal kommer
close_on_opposite_signal: true

# Max tillåten slippage i points
deviation_points: 20

log_file: logs/bot.log

strategy:
  fast_ema: 9
  slow_ema: 21
  trend_ema: 200          # köp bara över / sälj bara under denna EMA
  use_trend_filter: true
  rsi_period: 14
  rsi_overbought: 70      # inga köp när RSI är över detta
  rsi_oversold: 30        # inga sälj när RSI är under detta
  atr_period: 14
  sl_atr_mult: 2.0        # första stop loss = 2 x ATR
  tp_atr_mult: 0          # take profit = X x ATR, 0 = ingen (vinsten får löpa, trailing stop stänger)
  trailing_atr_mult: 3.0  # stop loss följer bästa priset på 3 x ATR avstånd, 0 = av
  breakeven_at_r: 1.0     # flytta stop loss till ingångspris när vinsten är 1 x risken, 0 = av
  use_adx_filter: false   # true = handla bara när ADX visar trend (gav sämre resultat i test)
  adx_period: 14
  adx_min: 25             # ADX under detta = sidledes marknad, ingen affär

risk:
  risk_per_trade_pct: 0.5     # % av saldot som riskeras per affär
  max_open_positions: 3       # totalt över alla symboler
  max_daily_loss_pct: 4.0     # dagsförlust (%) som stoppar handeln resten av dagen
  max_total_loss_pct: 5.0     # total förlust (%) under startsaldot som stoppar boten helt
  account_start_balance: 0    # startsaldo för totalgränsen, 0 = saldot när boten startade första gången
  close_on_limit: true        # stäng även öppna positioner när en förlustgräns nås
  max_spread_points: 30       # hoppa över affärer vid för stor spread

# Tider är brokerns SERVERTID (klockan som visas i MT5), inte svensk tid.
hours:
  close_before_weekend: true  # stäng alla positioner fredag kväll (skyddar mot helggap)
  friday_close_hour: 20       # från denna timme på fredagar
  use_session_filter: false   # true = öppna bara nya affärer mellan tiderna nedan (ej för D1)
  session_start_hour: 8
  session_end_hour: 20
